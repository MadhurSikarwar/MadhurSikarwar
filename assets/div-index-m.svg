<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 58" width="420" height="58" role="img" aria-labelledby="t d"><title id="t">Work index</title><desc id="d">Section 02: Work index</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}@keyframes dv{from{transform:translateX(0)}to{transform:translateX(169px)}}@keyframes dvc{0.0%{fill:#f2742a}25.0%{fill:#e0775f}50.0%{fill:#d9468f}75.0%{fill:#e0a21b}100.0%{fill:#f2742a}}.dv{animation:dv 11s linear infinite,dvc 24s linear infinite;fill:#f2742a}</style></defs><rect x=".5" y=".5" width="419" height="57" rx="12" fill="#111315" stroke="#262a2f"/><text x="24" y="35" class="m" font-size="13" font-weight="600" fill="#7f7d78" letter-spacing="2">02</text><text x="56" y="38" font-size="25" font-weight="650" fill="#eceae6" letter-spacing="-0.5">Work index</text><line x1="227" x2="396" y1="29" y2="29" stroke="#262a2f"/><circle class="dv" cx="227" cy="29" r="2.8"/></svg>
