<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="t d"><title id="t">Stack</title><desc id="d">From firmware to interface. firmware: C, C++, ESP32, Arduino, Sensors, Linux; backend + data: Python, Java, SQL, Flask, FastAPI, MySQL, PostgreSQL, MongoDB; machine learning: PyTorch, TensorFlow, scikit-learn, FinBERT, Demucs; interface + web3: TypeScript, JavaScript, React, Next.js, CesiumJS, Phaser, Solidity</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}@keyframes sk0{0%,7%{opacity:1}16%,100%{opacity:.5}}.sk0{animation:sk0 9.0s linear infinite;animation-delay:-0.35s;opacity:.5}@keyframes sk1{0%,7%{opacity:1}16%,100%{opacity:.5}}.sk1{animation:sk1 9.0s linear infinite;animation-delay:1.95s;opacity:.5}@keyframes sk2{0%,7%{opacity:1}16%,100%{opacity:.5}}.sk2{animation:sk2 9.0s linear infinite;animation-delay:4.25s;opacity:.5}@keyframes sk3{0%,7%{opacity:1}16%,100%{opacity:.5}}.sk3{animation:sk3 9.0s linear infinite;animation-delay:6.54s;opacity:.5}@keyframes pk{from{transform:translateX(0)}to{transform:translateX(936px)}}@keyframes pkc{0%,24.5%{fill:#f2742a}25.5%,50%{fill:#2fb7b5}51%,75.5%{fill:#8b7bff}76.5%,100%{fill:#2a8bc9}}.pk{animation:pk 9.0s linear infinite,pkc 9.0s linear infinite;fill:#f2742a}</style></defs><rect width="1000" height="270" rx="12" fill="#111315"/><line x1="32" x2="968" y1="54" y2="54" stroke="#262a2f" stroke-width="1.5"/><circle cx="36" cy="54" r="4.5" fill="#111315" stroke="#f2742a" stroke-width="1.5"/><g class="sk0 rm"><text x="32" y="30" class="m" font-size="11" font-weight="600" fill="#f2742a" letter-spacing="1.2">01</text><text x="56" y="30" class="m" font-size="11" font-weight="500" fill="#eceae6" letter-spacing="1.8">FIRMWARE</text></g><circle cx="275" cy="54" r="4.5" fill="#111315" stroke="#2fb7b5" stroke-width="1.5"/><g class="sk1 rm"><text x="271" y="30" class="m" font-size="11" font-weight="600" fill="#2fb7b5" letter-spacing="1.2">02</text><text x="295" y="30" class="m" font-size="11" font-weight="500" fill="#eceae6" letter-spacing="1.8">BACKEND + DATA</text></g><circle cx="514" cy="54" r="4.5" fill="#111315" stroke="#8b7bff" stroke-width="1.5"/><g class="sk2 rm"><text x="510" y="30" class="m" font-size="11" font-weight="600" fill="#8b7bff" letter-spacing="1.2">03</text><text x="534" y="30" class="m" font-size="11" font-weight="500" fill="#eceae6" letter-spacing="1.8">MACHINE LEARNING</text></g><circle cx="753" cy="54" r="4.5" fill="#111315" stroke="#2a8bc9" stroke-width="1.5"/><g class="sk3 rm"><text x="749" y="30" class="m" font-size="11" font-weight="600" fill="#2a8bc9" letter-spacing="1.2">04</text><text x="773" y="30" class="m" font-size="11" font-weight="500" fill="#eceae6" letter-spacing="1.8">INTERFACE + WEB3</text></g><circle class="pk" cx="32" cy="54" r="3.6"/><circle class="pk" cx="22" cy="54" r="2" opacity=".5"/><rect x="32" y="96" width="34" height="30" rx="6" fill="#16191c" stroke="#262a2f"/><rect x="32" y="102" width="2" height="18" fill="#f2742a"/><text x="50" y="116" class="m" font-size="13" font-weight="400" fill="#eceae6" text-anchor="middle">C</text><rect x="74" y="96" wid