<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="t d"><title id="t">Stack</title><desc id="d">From firmware to interface. firmware: C, C++, ESP32, Arduino, Sensors, Linux; backend + data: Python, Java, SQL, Flask, FastAPI, MySQL, PostgreSQL, MongoDB; machine learning: PyTorch, TensorFlow, scikit-learn, FinBERT, Demucs; interface + web3: TypeScript, JavaScript, React, Next.js, CesiumJS, Phaser, Solidity</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#e8ecf1}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.sat{animation:orb linear infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}@media (prefers-reduced-motion:reduce){.pulse,.ring,.sat{animation:none}}@keyframes st0{0%,7%{opacity:1}16%,100%{opacity:.5}}.st0{animation:st0 9.0s linear infinite;animation-delay:-0.35s;opacity:.5}@keyframes st1{0%,7%{opacity:1}16%,100%{opacity:.5}}.st1{animation:st1 9.0s linear infinite;animation-delay:1.95s;opacity:.5}@keyframes st2{0%,7%{opacity:1}16%,100%{opacity:.5}}.st2{animation:st2 9.0s linear infinite;animation-delay:4.25s;opacity:.5}@keyframes st3{0%,7%{opacity:1}16%,100%{opacity:.5}}.st3{animation:st3 9.0s linear infinite;animation-delay:6.54s;opacity:.5}@keyframes pk{from{transform:translateX(0)}to{transform:translateX(936px)}}.pk{animation:pk 9.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.f0,.f1,.f2,.hit,.fd0,.fd1,.fd2,.smp,.vote,.lit,.blk,.bt0{opacity:1!important}.head,.head2,.play,.bt{display:none}}</style></defs><rect width="1000" height="27