<svg viewBox="0 0 1440 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2CBF;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF006E;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.3" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes wave1 {
        0% { transform: translateX(0); }
        100% { transform: translateX(1440px); }
      }
      @keyframes wave2 {
        0% { transform: translateX(-1440px); }
        100% { transform: translateX(0); }
      }
      @keyframes wave3 {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      
      .wave-primary {
        animation: wave1 12s linear infinite;
        fill: url(#waveGradient1);
        filter: url(#glow);
      }
      .wave-secondary {
        animation: wave2 15s linear infinite;
        fill: url(#waveGradient2);
        filter: url(#glow);
      }
      .wave-accent {
        animation: wave3 4s ease-in-out infinite;
        fill: none;
        stroke: url(#waveGradient1);
        stroke-width: 2;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="200" fill="#0a0e27"/>

  <!-- Accent lines -->
  <line x1="0" y1="50" x2="1440" y2="50" stroke="#00D9FF" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="150" x2="1440" y2="150" stroke="#7B2CBF" stroke-width="1" opacity="0.2"/>

  <!-- Primary wave -->
  <g class="wave-primary">
    <path d="M0,100 Q360,20 720,100 T1440,100 L1440,200 L0,200 Z"/>
  </g>

  <!-- Secondary wave -->
  <g class="wave-secondary">
    <path d="M0,120 Q360,40 720,120 T1440,120 L1440,200 L0,200 Z"/>
  </g>

  <!-- Accent wave -->
  <g class="wave-accent">
    <path d="M0,80 Q360,30 720,80 T1440,80"/>
  </g>

  <!-- Particle effects -->
  <circle cx="200" cy="80" r="2" fill="#00D9FF" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="100" r="2" fill="#FF006E" opacity="0.6">
    <animate attributeName="cy" values="100;70;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="90" r="2" fill="#7B2CBF" opacity="0.6">
    <animate attributeName="cy" values="90;50;90" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1300" cy="110" r="2" fill="#00D9FF" opacity="0.6">
    <animate attributeName="cy" values="110;75;110" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>