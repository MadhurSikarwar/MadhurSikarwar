<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" role="img" aria-labelledby="t d"><title id="t">Madhur Rishi Sikarwar</title><desc id="d">Engineering with purpose. Research over hype. Madhur Rishi Sikarwar.</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}@keyframes ti{0%,100%{opacity:.35}6%,16%{opacity:1}30%{opacity:.35}}.ti{animation:ti 6s linear infinite;opacity:.35}</style></defs><rect width="420" height="160" rx="14" fill="#111315"/><text x="210" y="48" font-size="16" font-weight="400" fill="#a8a6a0" text-anchor="middle">Engineering with purpose.</text><text x="210" y="70" font-size="16" font-weight="400" fill="#a8a6a0" text-anchor="middle">Research over hype.</text><text x="210" y="98" class="m" font-size="9.5" font-weight="500" fill="#7f7d78" letter-spacing="2" text-anchor="middle">MADHUR RISHI SIKARWAR</text><rect class="ti rm" x="174" y="116" width="12" height="12" rx="2.5" fill="#f2742a" style="animation-delay:0.00s"/><rect class="ti rm" x="194" y="116" width="12" height="12" rx="2.5" fill="#e0775f" style="animation-delay:0.35s"/><rect class="ti rm" x="214" y="116" width="12" heig