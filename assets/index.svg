s steps(1) infinite}@keyframes sc3{0.00%,33.32%{transform:translateY(0px)}33.33%,66.66%{transform:translateY(34px)}66.67%,99.99%{transform:translateY(68px)}}.sc3{animation:sc3 4.800000000000001s steps(1) infinite}@keyframes sheen{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}.sheen{animation:sheen 9s linear infinite}</style></defs><rect width="1000" height="258" rx="14" fill="#111315"/><text x="30" y="40" class="m" font-size="10.5" font-weight="500" fill="#7f7d78" letter-spacing="2.2">WORK INDEX</text><rect x="30" y="24" width="6" height="3" fill="#f2742a"/><rect x="38" y="24" width="6" height="3" fill="#e0775f"/><rect x="46" y="24" width="6" height="3" fill="#d9468f"/><rect x="54" y="24" width="6" height="3" fill="#e0a21b"/><rect class="sc0" x="22" y="107" width="230" height="26" rx="5" fill="#fff" fill-opacity=".05"/><text x="30" y="92" class="m" font-size="10" font-weight="500" fill="#7f7d78" letter-spacing="1.8">SYSTEMS + IOT</text><text x="244" y="92" class="m" font-size="10" font-weight="500" fill="#7f7d78" letter-spacing="1" text-anchor="end">3</text><line x1="30" x2="244" y1="102" y2="102" stroke="#262a2f"/><circle cx="37" cy="121" r="4.5" fill="#f2742a"/><circle cx="37" cy="121" r="8" fill="none" stroke="#f2742a" stroke-opacity=".3"/><text x="54" y="126" font-size="15.5" font-weight="400" fill="#eceae6">ResQMesh</text><circle cx="37" cy="155" r="4" fill="none" stroke="#7f7d78" stroke-width="1.2"/><text x="54" y="160" font-size="15.5" font-weight="400" fill="#a8a6a0">Algal bloom</text><circle cx="37" cy="189" r="4" fill="none" stroke="#7f7d78" stroke-width="1.2"/><text x="54" y="194" font-size="15.5" font-weight="400" fill="#a8a6a0">ECOSAT</text><rect class="sc1" x="264" y="107" width="230" height="26" rx="5" fill="#fff" fill-opacity=".05"/><text x="272" y="92" class="m" font-size="10" font-weight="500" fill="#7f7d78" letter-spacing="1.8">AI + DATA</text><text x="486" y="92" class="m" font-size="10" font-weight="500" fill="#7f7d78" lette