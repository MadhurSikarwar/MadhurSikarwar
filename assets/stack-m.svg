<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" role="img" aria-labelledby="t d"><title id="t">Stack</title><desc id="d">From firmware to interface. firmware: C, C++, ESP32, Arduino, Sensors, Linux; backend + data: Python, Java, SQL, Flask, FastAPI, MySQL, PostgreSQL, MongoDB; machine learning: PyTorch, TensorFlow, scikit-learn, FinBERT, Demucs; interface + web3: TypeScript, JavaScript, React, Next.js, CesiumJS, Phaser, Solidity</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}@keyframes pk{from{transform:translateY(0)}to{transform:translateY(498px)}}@keyframes pkc{0%,24.5%{fill:#f2742a}25.5%,50%{fill:#2fb7b5}51%,75.5%{fill:#8b7bff}76.5%,100%{fill:#2a8bc9}}.pk{animation:pk 9s linear infinite,pkc 9s linear infinite;fill:#f2742a}</style></defs><rect width="420" height="560" rx="12" fill="#111315"/><line x1="36" x2="36" y1="36" y2="534" stroke="#262a2f" stroke-width="1.5"/><circle cx="36" cy="36" r="4.5" fill="#111315" stroke="#f2742a" stroke-width="1.5"/><text x="54" y="40" class="m" font-size="11" font-weight="600" fill="#f2742a" letter-spacing="1.2">01</text><text x="78" y="40" class="m" f