<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d"><title id="t">Now</title><desc id="d">building self-healing ESP32 mesh networks; training domain-adapted NLP models (FinBERT); exploring federated learning and smart-contract security; polishing OrbitWatch: 35,000 objects, tracked live</desc><defs><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}</style></defs><rect x=".5" y=".5" width="999" height="199" rx="10" fill="#111315" stroke="#262a2f"/><text x="28" y="34" class="m" font-size="11" font-weight="500" fill="#7f7d78" letter-spacing="2">NOW</text><line x1="28" x2="972" y1="48" y2="48" stroke="#262a2f"/><rect x="28" y="0" width="6" height="2" fill="#f2742a"/><rect x="36" y="0" width="6" height="2" fill="#e0775f"/><rect x="44" y="0" width="6" height="2" fill="#4f63c9"/><rect x="52" y="0" width="6" height="2" fill="#9ad1e0"/><circle class="pulse" cx="34" cy="74" r="3.6" fill="#f2742a"/><text x="52" y="78" class="m" font-size="11" font-weight="500" fill="#7f7d78" letter-spacing="1.6">BUILDING</text><text x="176" y="78" font-size="14.5" font-weight="400" fill="#eceae6">se