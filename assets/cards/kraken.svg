<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 286" width="436" height="286" role="img" aria-labelledby="t d"><title id="t">KRAKEN: Dead Signal</title><desc id="d">KRAKEN: Dead Signal. A 2D cyberpunk survival-horror game: hacking the facility makes noise, and noise draws the octopus hunting you. Playable in the browser. Built with TypeScript, Phaser 3.</desc><defs><clipPath id="hc"><path d="M.5 10.5a10 10 0 0 1 10-10h415a10 10 0 0 1 10 10V96H.5z"/></clipPath><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#e8ecf1}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.sat{animation:orb linear infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}@media (prefers-reduced-motion:reduce){.pulse,.ring,.sat{animation:none}}@keyframes noise{0%{transform:scale(.6);opacity:.8}100%{transform:scale(6.5);opacity:0}}.noise{transform-box:fill-box;transform-origin:center;animation:noise 3.3s ease-out infinite}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.f0,.f1,.f2,.hit,.fd0,.fd1,.fd2,.smp,.vote,.lit,.blk,.bt0{opacity:1!important}.head,.head2,.play,.bt{display:none}}</style></defs><rect x=".5" y=".5" width="435" height="269" rx="10" fill="#0b0e12" stroke="#1d232c"/><g clip-path="url(#hc)"><rect width="436" height="96" fill="#0e1217"/><rect x="24" y="10" width="66" height="34" rx="2" fill="none" stroke="#29323d"/><rect x="24" y="56" width="52" height="30" rx="2" fill="none" stroke="#29323d"/><rect x="176" y="8" width="80" height="26" rx="2" fill="none" stroke="#29323d"/><rect x="214" y="52" width="70" height="34" rx="2" fill="none" stroke="#29323d"/><rect x="310" y="14" width="56" height="28" rx="2" fill="none" stroke="#29323d"/><rect x="330" y="58" width="84" height="28" rx="2" fill="none" stroke="#29323d"/><circle class="noise" cx="128" cy="50" r="10" fill="none" stroke="#9ad1e0" style="animation-delay:0.0s"/><circle class="noise" cx="128" cy="50" r="10" fill="none" stroke="#9ad1e0" style="animation-delay:1.1s"/><circle class="noise" cx="128" cy="50" r="10" fill="none" stroke="#9ad1e0" style="animation-delay:2.2s"/><g class="spin" style="transform-origin:128px 50px"><line x1="128" y1="50" x2="212" y2="50" stroke="#9ad1e0" stroke-opacity=".8"/><path d="M128 50L212 36A86 86 0 0 1 212 50Z" fill="#9ad1e0" fill-opacity=".07"/></g><circle cx="128" cy="50" r="3.4" fill="#9ad1e0"/><circle class="sat" r="3.4" fill="#e3a33b" style="offset-path:path('M420 20 L360 44 L280 40 L216 58 L170 52');animation-duration:7.5s;animation-delay:-0s"/><circle class="ring" cx="170" cy="52" r="5" fill="none" stroke="#e3a33b" style="animation-delay:-2s"/><text x="28" y="92" class="m" font-size="7.5" font-weight="500" fill="#78828f" letter-spacing="0.8" text-anchor="start">HACKING MAKES NOISE</text><text x="410" y="92" class="m" font-size="7.5" font-weight="500" fill="#e3a33b" letter-spacing="0.8" text-anchor="end">NOISE DRAWS THE THREAT</text></g><line x1="0" x2="436" y1="96.5" y2="96.5" stroke="#1d232c"/><rect x="22" y="0" width="26" height="2" fill="#9ad1e0"/><text x="22" y="124" class="m" font-size="10" font-weight="500" fill="#78828f" letter-spacing="1.5" text-anchor="start">09  ·  GAME</text><text x="22" y="154" font-size="20" font-weight="650" fill="#e8ecf1" letter-spacing="-0.3" text-anchor="start">KRAKEN: Dead Signal</text><text x="22" y="178.0" font-size="13.4" font-weight="400" fill="#98a2b0" text-anchor="start">A 2D cyberpunk survival-horror game: hacking the</text><text x="22" y="196.5" font-size="13.4" font-weight="400" fill="#98a2b0" text