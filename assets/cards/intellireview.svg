<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 286" width="436" height="286" role="img" aria-labelledby="t d"><title id="t">IntelliReview</title><desc id="d">IntelliReview. A static analyzer for C, C++ and Java: control-flow, pointer and taint analysis plus ML. Returns risky lines, the fix and a verdict. Built with Python, pycparser, javalang.</desc><defs><clipPath id="hc"><path d="M.5 10.5a10 10 0 0 1 10-10h415a10 10 0 0 1 10 10V96H.5z"/></clipPath><linearGradient id="scanfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad1e0" stop-opacity="0"/><stop offset="1" stop-color="#9ad1e0" stop-opacity=".22"/></linearGradient><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#e8ecf1}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.sat{animation:orb linear infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}@media (prefers-reduced-motion:reduce){.pulse,.ring,.sat{animation:none}}@keyframes sweep{0%{transform:translateY(4px)}55%,100%{transform:translateY(86px)}}.sweep{animation:sweep 6.5s ease-in-out infinite}@keyframes hit{0%,34%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}.hit{animation:hit 6.5s linear infinite;opacity:0}@keyframes fd0{0%,40%{opacity:0}44%,92%{opacity:1}100%{opacity:0}}.fd0{animation:fd0 6.5s linear infinite;opacity:0}@keyframes fd1{0%,49%{opacity:0}53%,92%{opacity:1}100%{opacity:0}}.fd1{animation:fd1 6.5s linear infinite;opacity:0}@keyframes fd2{0%,58%{opacity:0}62%,92%{opacity:1}100%{opacity:0}}.fd2{animation:fd2 6.5s linear infinite;opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}.f0,.f1,.f