<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 286" width="436" height="286" role="img" aria-labelledby="t d"><title id="t">ResQMesh</title><desc id="d">ResQMesh. A disaster network that needs no infrastructure: a self-healing ESP32 mesh with Bellman-Ford routing and SOS packets sent first. Built with C++, ESP32, React, FastAPI.</desc><defs><clipPath id="hc"><path d="M.5 10.5a10 10 0 0 1 10-10h415a10 10 0 0 1 10 10V96H.5z"/></clipPath><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#e8ecf1}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.sat{animation:orb linear infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}@media (prefers-reduced-motion:reduce){.pulse,.ring,.sat{animation:none}}@keyframes flap{0%,38%{opacity:1}42%,64%{opacity:.08}68%,100%{opacity:1}}.flap{animation:flap 7s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.f0,.f1,.f2,.hit,.fd0,.fd1,.fd2,.smp,.vote,.lit,.blk,.bt0{opacity:1!important}.head,.head2,.play,.bt{display:none}}</style></defs><rect x=".5" y=".5" width="435" height="269" rx="10" fill="#0b0e12" stroke="#1d232c"/><g clip-path="url(#hc)"><rect width="436" height="96" fill="#0e1217"/><line x1="46" y1="66" x2="104" y2="28" stroke="#29323d" stroke-width="1"/><line x1="46" y1="66" x2="116" y2="74" stroke="#29323d" stroke-width="1"/><line x1="104" y1="28" x2="184" y2="46" stroke="#29323d" stroke-width="1"/><line x1="116" y1="74" x2="184" y2="46" stroke="#29323d" stroke-width="1"/><line x1="116" y1="74" x2="246" y2="78" stroke="#29323d" stroke-width="1"/><line x1="184" y1="46" x2="246" y2="