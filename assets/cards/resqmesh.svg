<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 286" width="436" height="286" role="img" aria-labelledby="t d"><title id="t">ResQMesh</title><desc id="d">ResQMesh. A disaster network that needs no infrastructure: a self-healing ESP32 mesh with Bellman-Ford routing and SOS packets sent first. Built with C++, ESP32, React, FastAPI.</desc><defs><clipPath id="cp"><rect x=".5" y=".5" width="435" height="269" rx="8"/></clipPath><style>text{font-family:'SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace}.sf{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.8);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.4s ease-out infinite}@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}.sat{animation:orb linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}.nm{display:none}}@keyframes tape{to{transform:translateX(22px)}}.tape{animation:tape 1.8s linear infinite}@keyframes flap{0%,38%{opacity:1}42%,64%{opacity:.08}68%,100%{opacity:1}}.flap{animation:flap 7s steps(1) infinite}@keyframes ms{0%,100%{opacity:.22}12%,46%{opacity:1}}.ms{animation:ms 3.4s linear infinite;opacity:.22}</style></defs><rect x=".5" y=".5" width="435" height="269" rx="8" fill="#13100d" stroke="#3a3027"/><g clip-path="url(#cp)"><rect x=".5" y="12" width="435" height="104" fill="#1a1611"/><line x1="20" x2="20" y1="12" y2="116" stroke="#221c16"/><line x1="44" x2="44" y1="12" y2="116" stroke="#221c16"/><line x1="68" x2="68" y1="12" y2="116" stroke="#221c16"/><line x1="