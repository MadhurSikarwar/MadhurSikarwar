<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slither {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px #00D9FF); }
        50% { filter: drop-shadow(0 0 15px #FF006E); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .snake-path {
        stroke-dasharray: 2000;
        animation: slither 8s linear infinite, glow 3s ease-in-out infinite;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .contribution-grid {
        opacity: 0.3;
      }
      
      .grid-line {
        stroke: #00D9FF;
        stroke-width: 0.5;
      }
      
      .particle {
        animation: pulse 2s ease-in-out infinite;
      }
    </style>

    <linearGradient id="snakeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF006E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2CBF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="#0a0e27"/>

  <!-- Grid background -->
  <g class="contribution-grid">
    <g class="grid-line">
      <line x1="0" y1="50" x2="1200" y2="50"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="400" y1="0" x2="400" y2="300"/>
      <line x1="500" y1="0" x2="500" y2="300"/>
      <line x1="600" y1="0" x2="600" y2="300"/>
      <line x1="700" y1="0" x2="700" y2="300"/>
      <line x1="800" y1="0" x2="800" y2="300"/>
      <line x1="900" y1="0" x2="900" y2="300"/>
      <line x1="1000" y1="0" x2="1000" y2="300"/>
      <line x1="1100" y1="0" x2="1100" y2="300"/>
    </g>
  </g>

  <!-- Contribution squares (simulated activity) -->
  <g opacity="0.4">
    <rect x="20" y="40" width="12" height="12" fill="#00D9FF" rx="2"/>
    <rect x="40" y="40" width="12" height="12" fill="#0080FF" rx="2"/>
    <rect x="60" y="40" width="12" height="12" fill="#00D9FF" rx="2"/>
    <rect x="80" y="40" width="12" height="12" fill="#FF006E" rx="2"/>
    <rect x="100" y="40" width="12" height="12" fill="#7B2CBF" rx="2"/>
    <rect x="120" y="40" width="12" height="12" fill="#00D9FF" rx="2"/>
    
    <rect x="20" y="65" width="12" height="12" fill="#0080FF" rx="2"/>
    <rect x="40" y="65" width="12" height="12" fill="#00D9FF" rx="2"/>
    <rect x="60" y="65" width="12" height="12" fill="#FF006E" rx="2"/>
    <rect x="80" y="65" width="12" height="12" fill="#00D9FF" rx="2"/>
    <rect x="100" y="65" width="12" height="12" fill="#7B2CBF" rx="2"/>
    
    <rect x="20" y="90" width="12" height="12" fill="#7B2CBF" rx="2"/>
    <rect x="40" y="90" width="12" height="12" fill="#00D9FF" rx="2"/>
    <rect x="60" y="90" width="12" height="12" fill="#0080FF" rx="2"/>
    <rect x="80" y="90" width="12" height="12" fill="#FF006E" rx="2"/>
  </g>

  <!-- Animated snake path -->
  <path class="snake-path" stroke="url(#snakeGradient)" d="M 50,80 Q 150,40 250,80 T 450,80 Q 550,120 650,80 T 850,80 Q 950,40 1050,80 L 1050,120 Q 950,80 850,120 T 650,120 Q 550,80 450,120 T 250,120 Q 150,160 50,120 Z"/>

  <!-- Particle effects -->
  <circle class="particle" cx="100" cy="60" r="2" fill="#00D9FF"/>
  <circle class="particle" cx="300" cy="100" r="2" fill="#FF006E" style="animation-delay: 0.5s"/>
  <circle class="particle" cx="500" cy="80" r="2" fill="#7B2CBF" style="animation-delay: 1s"/>
  <circle class="particle" cx="700" cy="95" r="2" fill="#00D9FF" style="animation-delay: 1.5s"/>
  <circle class="particle" cx="900" cy="70" r="2" fill="#FF006E" style="animation-delay: 2s"/>
  <circle class="particle" cx="1050" cy="110" r="2" fill="#7B2CBF" style="animation-delay: 2.5s"/>

  <!-- Text overlay -->
  <text x="600" y="250" font-family="monospace" font-size="14" fill="#00D9FF" text-anchor="middle" opacity="0.8">
    🔥 Building momentum. Pushing commits. Shipping features. 🔥
  </text>
</svg>